name: build-firmware
# Release flow: bump the VERSION file on main -> CI builds and publishes release v<VERSION>
# (the release step creates the tag itself). Pushes that don't change VERSION just compile-check.
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: ver
        run: |
          V=$(tr -d ' \r\n' < VERSION)
          echo "version=$V" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v$V" >/dev/null; then echo "release=false" >> "$GITHUB_OUTPUT"; else echo "release=true" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ hashFiles('platformio.ini') }}
      - run: pip install platformio
      - name: Build OTA image (no secrets; credentials live in the ESP32's flash storage)
        env:
          PLATFORMIO_BUILD_FLAGS: -DPROBE_FW_VERSION=\"${{ steps.ver.outputs.version }}\"
        run: pio run -e ota
      - run: cp .pio/build/ota/firmware.bin firmware.bin && sha256sum firmware.bin | tee firmware.sha256
      - uses: actions/upload-artifact@v4
        with: { name: firmware, path: 'firmware.*' }
      - name: Publish release v${{ steps.ver.outputs.version }}
        if: steps.ver.outputs.release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: |
            firmware.bin
            firmware.sha256
          generate_release_notes: true
