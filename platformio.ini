; Loom probe v2 — Wi-Fi + MQTT (HiveMQ Cloud, TLS) + HTTPS OTA + filtered loom events
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = time, log2file, default
lib_deps = knolleary/PubSubClient@^2.8
build_flags = -DPROBE_FW_VERSION=\"2.1.1\"

; OTA image: identical firmware but WITHOUT secrets.h, reads Wi-Fi/MQTT from the ESP32's flash storage
[env:ota]
extends = env:esp32dev
build_flags = -DNO_SECRETS   ; version comes from the git tag in CI (PLATFORMIO_BUILD_FLAGS)
